<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-signin-client_id" content="678717011887-3gh7chfl1fc8j3d10g0fma01h4qltnfb.apps.googleusercontent.com">
    <title>Shiron</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1f6b3a">
    <!-- העיצוב שנבחר בהגדרות, לפני שהדף מצויר (בלי הבהוב) -->
    <script>
        // העיצובים לבחירה בהגדרות (השם = הצבעים ב-style.css). העיצוב השמור נקבע לפני שהדף מצויר, בלי הבהוב
        window.SHIRON_THEMES = [["irish", "אירי"], ["sea", "ים"], ["sky", "שמיים"], ["forest", "יער"], ["lemon", "לימון"], ["peach", "אפרסק"],
            ["sunset", "שקיעה"], ["rose", "ורד"], ["berry", "פטל"], ["lavender", "לבנדר"], ["coffee", "קפה"], ["stone", "אבן"], ["scroll", "מגילה"]];
        try { var t = localStorage.getItem("appTheme"); document.documentElement.dataset.theme = window.SHIRON_THEMES.some(function (x) { return x[0] === t; }) ? t : "irish"; }
        catch (e) { document.documentElement.dataset.theme = "irish"; }
    </script>
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- תפריט חשבון מתקפל: התחברות, אופליין ועותקים -->
    <div id="accountMenu" class="account-menu">
        <button id="accountToggleBtn" class="account-toggle">
            <span>⚙️</span>
            <span id="accountOfflineIcon" class="hidden">📴</span>
            <span id="accountLabel">התחברות</span>
            <span id="accountStatus"></span>
            <span class="toggle-text">הגדרות</span>
            <span class="caret">▾</span>
        </button>
        <div id="accountPanel" class="account-panel hidden">
            <div class="settings-section">
                <div class="settings-title">חשבון</div>
                <div id="accountInfo"></div>
                <div id="offlineBanner" class="offline-banner hidden"></div>
                <div id="syncError" class="sync-error hidden"></div>
            </div>
            <div class="settings-section">
                <div class="settings-title">עיצוב</div>
                <div class="theme-picker" id="themePicker"></div>
                <div class="offline-row">
                    <button id="nightModeBtn">🌙 מצב לילה</button>
                    <button id="colorChordsBtn">🎨 אקורדים צבעוניים</button>
                </div>
            </div>
            <div class="settings-section">
                <div class="settings-title">שמירה וגיבוי</div>
                <div class="offline-row">
                    <button id="downloadOfflineBtn" class="hidden" disabled>📥 הורד לשימוש אופליין</button>
                    <button id="manageOfflineBtn">🗂️ עותקי אופליין</button>
                </div>
                <div class="offline-row">
                    <button id="exportBackupBtn">💾 גיבוי לקובץ</button>
                    <button id="importBackupBtn">📂 שחזור מגיבוי</button>
                    <input type="file" id="importBackupInput" accept=".json,application/json" class="hidden">
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-header">
        <button id="menuToggleBtn" class="menu-btn">☰ ספרייה</button>
        <span class="mobile-title">Shiron 🎸</span>
    </div>

    <div class="app-layout">
        <!-- מסך כהה לסגירת התפריט בנייד בלחיצה בחוץ -->
        <div id="drawerOverlay" class="drawer-overlay"></div>

        <!-- סרגל צד / מגירה -->
        <aside class="sidebar" id="sidebarArea">
            <div class="sidebar-header">
                <h2 id="sidebarTitle">📚 הספרייה העברית</h2>
                <button id="closeSidebarBtn" class="close-sidebar-btn">✕</button>
            </div>
            <div class="lib-switch">
                <button id="libHeBtn" class="active">עברית</button>
                <button id="libEnBtn">English</button>
            </div>
            <div class="sidebar-actions">
                <button id="addFolderBtnRoot">➕ תיקייה חדשה</button>
            </div>
            <div class="lib-search">
                <input type="search" id="libSearchInput" placeholder="🔍 חפש בספרייה (שם או מילים)...">
            </div>
            <div id="libSearchResults" class="lib-search-results hidden"></div>

            <div id="libraryContainer"></div>

            <div id="rootDropZone" class="root-drop-zone">
                📥 גרור לכאן כדי להעביר לתיקייה הראשית
            </div>
        </aside>

        <!-- אזור מרכזי -->
        <main class="main-content">
            <div class="container">
                <h1 class="desktop-only">Shiron 🎸</h1>
                
                <div class="search-area">
                    <input type="text" id="searchInput" placeholder="חפש שיר (לחץ Enter)...">
                    <button id="searchBtn">חפש</button>
                </div>

                <div class="controls">
                    <button id="transposeUp">העלה חצי טון (+)</button>
                    <button id="transposeDown">הורד חצי טון (-)</button>
                    <div class="font-size-group">
                        <button id="fontSmallerBtn" title="הקטן גופן">A−</button>
                        <span id="fontSizeLabel"></span>
                        <button id="fontBiggerBtn" title="הגדל גופן">A+</button>
                    </div>
                    <button id="saveBtn" class="hidden">💾 שמור שיר לראשי</button>
                    <button id="saveChangesBtn" class="hidden">💾 שמור שינויים בשיר</button>
                </div>

                <div class="tools-row">
                    <button id="autoScrollBtn">▶ גלילה</button>
                    <div class="ctl-group">
                        <button id="scrollSlowerBtn" title="לאט יותר">🐢</button>
                        <span id="scrollSpeedLabel"></span>
                        <button id="scrollFasterBtn" title="מהר יותר">🐇</button>
                    </div>
                </div>

                <div id="sourceInfo" class="hidden"></div>
                <div id="searchResults" class="search-results hidden"></div>
                
                <div id="songDisplayWrapper">
                    <div id="songDisplay">
                        חפש שיר כדי לשאוב אותו, או בחר שיר מעץ התיקיות...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- תפריט קליק ימני / לחיצה ארוכה -->
    <div id="contextMenu" class="context-menu hidden">
        <ul id="contextMenuList"></ul>
    </div>

    <!-- מודאל בחירת צבע -->
    <div id="colorModal" class="modal-overlay hidden">
        <div class="color-palette-card">
            <h3>בחר צבע לתיקייה</h3>
            <div class="palette-grid" id="paletteGrid"></div>
            <button id="closePaletteBtn">ביטול</button>
        </div>
    </div>

    <!-- מודאל העברה לתיקייה -->
    <div id="moveModal" class="modal-overlay hidden">
        <div class="color-palette-card move-card">
            <h3>העבר לתיקייה</h3>
            <div id="moveFolderList" class="move-folder-list"></div>
            <button id="closeMoveBtn">ביטול</button>
        </div>
    </div>

    <!-- מודאל עותקי אופליין -->
    <div id="offlineModal" class="modal-overlay hidden">
        <div class="color-palette-card move-card">
            <h3>עותקי אופליין</h3>
            <div id="offlineList" class="move-folder-list"></div>
            <button id="closeOfflineBtn">סגור</button>
        </div>
    </div>

    <!-- מודאל עריכת שיר -->
    <div id="editModal" class="modal-overlay hidden">
        <div class="color-palette-card edit-card">
            <h3>עריכת שיר</h3>
            <input type="text" id="editTitleInput" dir="auto" placeholder="שם השיר">
            <div class="edit-hint">הטקסט המקורי (לפני שינוי טון). שורת אקורדים = שורה שיש בה רק אקורדים.</div>
            <textarea id="editContentInput" dir="auto" spellcheck="false"></textarea>
            <div class="modal-btns">
                <button id="editSaveBtn" class="primary">💾 שמור</button>
                <button id="editCancelBtn">ביטול</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="firebase-sync.js"></script>
    <script src="app.js"></script>
</body>
</html>
